<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image OCR Extractor</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --muted:#94a3b8; --text:#e2e8f0; --accent:#38bdf8; --ok:#4ade80; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:28px 32px 8px; }
    h1 { margin:0; font-size:1.6rem; } h1 span { color:var(--accent); }
    header p { margin:6px 0 0; color:var(--muted); }
    main { display:grid; grid-template-columns: 1fr 1fr; gap:20px; padding:20px 32px 32px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .card { background:var(--card); border-radius:14px; padding:20px; }
    .card h2 { margin:0 0 12px; font-size:1rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    #drop { border:2px dashed #475569; border-radius:12px; padding:22px; text-align:center; cursor:pointer; color:var(--muted); }
    #drop.over { border-color:var(--accent); color:var(--text); }
    .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:14px; }
    select, button { background:#0b1222; color:var(--text); border:1px solid #334155; border-radius:8px; padding:8px 12px; font-size:.95rem; }
    button { background:var(--accent); color:#04263a; font-weight:600; border:none; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .preview { position:relative; margin-top:16px; }
    .preview canvas { max-width:100%; border-radius:8px; background:white; display:block; }
    pre { white-space:pre-wrap; background:#0b1222; border-radius:10px; padding:16px; min-height:140px; font-size:1rem; line-height:1.5; margin:0; }
    .stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .pill { background:#0b1222; border-radius:999px; padding:4px 12px; font-size:.85rem; color:var(--muted); }
    .pill b { color:var(--ok); }
    .error { color:#f87171; }
  </style>
</head>
<body>
  <header>
    <h1>Image <span>OCR</span> Extractor</h1>
    <p>OpenCV preprocessing + Tesseract OCR. Upload an image to extract its text, with word-level confidence.</p>
  </header>
  <main>
    <section class="card">
      <h2>Input</h2>
      <div id="drop">Drop an image here or <u>click to choose</u> (PNG, JPG, TIFF…)</div>
      <input id="file" type="file" accept="image/*" hidden />
      <div class="controls">
        <label>Language <select id="lang"><option value="eng">eng</option></select></label>
        <label>Threshold
          <select id="threshold"><option>otsu</option><option>adaptive</option><option>none</option></select>
        </label>
        <label><input id="preprocess" type="checkbox" checked /> Preprocess</label>
        <button id="run" disabled>Extract text</button>
      </div>
      <div class="preview"><canvas id="canvas" hidden></canvas></div>
    </section>
    <section class="card">
      <h2>Extracted text</h2>
      <pre id="output">Results will appear here.</pre>
      <div class="stats" id="stats"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let file = null, img = null;

    fetch("/languages").then(r => r.ok ? r.json() : null).then(d => {
      if (!d) return;
      $("lang").innerHTML = d.languages.filter(l => l !== "osd")
        .map(l => `<option ${l === "eng" ? "selected" : ""}>${l}</option>`).join("");
    });

    // Word boxes come back in preprocessed-image coordinates; undo resize + deskew to overlay them.
    let transform = { scale: 1, angle: 0 };
    function draw(words = []) {
      const c = $("canvas"), ctx = c.getContext("2d");
      c.width = img.naturalWidth; c.height = img.naturalHeight; c.hidden = false;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(img, 0, 0);
      const { scale, angle } = transform;
      const cx = (img.naturalWidth * scale) / 2, cy = (img.naturalHeight * scale) / 2;
      ctx.scale(1 / scale, 1 / scale);
      ctx.translate(cx, cy); ctx.rotate((-angle * Math.PI) / 180); ctx.translate(-cx, -cy);
      ctx.lineWidth = Math.max(2, (img.naturalWidth * scale) / 300);
      for (const w of words) {
        ctx.strokeStyle = w.confidence >= 80 ? "#22c55e" : w.confidence >= 50 ? "#f59e0b" : "#ef4444";
        ctx.strokeRect(w.bbox.left, w.bbox.top, w.bbox.width, w.bbox.height);
      }
    }

    function choose(f) {
      if (!f) return;
      file = f; $("run").disabled = false;
      $("drop").textContent = f.name;
      transform = { scale: 1, angle: 0 };
      img = new Image(); img.onload = () => draw(); img.src = URL.createObjectURL(f);
    }
    $("drop").onclick = () => $("file").click();
    $("file").onchange = (e) => choose(e.target.files[0]);
    $("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
    $("drop").ondragleave = () => $("drop").classList.remove("over");
    $("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); choose(e.dataTransfer.files[0]); };

    $("run").onclick = async () => {
      const body = new FormData();
      body.append("file", file);
      body.append("lang", $("lang").value);
      body.append("threshold", $("threshold").value);
      body.append("preprocess", $("preprocess").checked);
      $("run").disabled = true; $("output").textContent = "Extracting…"; $("stats").innerHTML = "";
      try {
        const res = await fetch("/ocr", { method: "POST", body });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        $("output").textContent = data.text || "(no text found)";
        $("stats").innerHTML = `
          <span class="pill">words <b>${data.word_count}</b></span>
          <span class="pill">mean confidence <b>${data.mean_confidence}%</b></span>
          <span class="pill">pipeline <b>${data.preprocessing.join(" → ") || "off"}</b></span>`;
        const resize = data.preprocessing.find(s => s.startsWith("resize"));
        const deskew = data.preprocessing.find(s => s.startsWith("deskew"));
        transform = {
          scale: resize ? parseFloat(resize.split("x")[1]) : 1,
          angle: deskew ? parseFloat(deskew.split(" ")[1]) : 0,
        };
        draw(data.words);
      } catch (err) {
        $("output").innerHTML = `<span class="error">${err.message}</span>`;
      } finally { $("run").disabled = false; }
    };
  </script>
</body>
</html>
